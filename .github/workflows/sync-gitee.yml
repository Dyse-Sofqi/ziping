name: Sync release to Gitee

# Manual "re-sync" button for the Gitee mirror: rebuilds the artifacts of an
# already published tag and creates/updates the matching release on
# gitee.com/sofqi/ziping. Normal releases are mirrored automatically by
# .github/workflows/release.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to mirror (e.g. 1.4.3)'
        required: true
        type: string
      overwrite:
        description: 'Re-upload assets that already exist on the Gitee release'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITEE_REPO: sofqi/ziping
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Read the GitHub release notes
        if: ${{ env.GITEE_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --json body --jq .body > gitee-release-notes.md

      - name: Create or update the Gitee release
        if: ${{ env.GITEE_TOKEN != '' }}
        run: |
          node scripts/sync-gitee-release.mjs \
            --tag "${{ inputs.tag }}" \
            --notes-file gitee-release-notes.md \
            ${{ inputs.overwrite && '--overwrite' || '' }}
